<nav class="flex justify-between items-center w-full px-margin-desktop max-w-7xl mx-auto h-16">

<div class="hidden md:flex items-center gap-xl">
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors font-body-md text-body-md" href="#">Home</a>

                    Sign Up

</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-margin-mobile relative">
<!-- Abstract Background Decoration -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary opacity-10 rounded-full blur-[120px]"></div>
<div class="absolute top-1/2 -right-24 w-64 h-64 bg-secondary opacity-15 rounded-full blur-[100px]"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-[450px] bg-surface-container-low border border-outline-variant rounded-xl p-xl login-card-shadow relative z-10">
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary/10 mb-md">
<span class="material-symbols-outlined text-primary text-3xl">lock_open</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-xs">Welcome Back</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Enter your credentials to access your dashboard</p>
</div>
<form class="space-y-lg" id="loginForm">
<!-- Email Field -->
<div class="space-y-base">
<label class="text-label-md font-label-md text-on-surface" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-11 pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none font-body-md text-body-md text-on-surface placeholder:text-outline" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-md font-label-md text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">key</span>
<input class="w-full pl-11 pr-11 py-md bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none font-body-md text-body-md text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary/50" id="remember" type="checkbox"/>
<label class="ml-sm text-body-sm font-body-sm text-on-surface-variant" for="remember">Remember me for 30 days</label>
</div>
<!-- Log In Button -->
<button class="w-full py-md bg-primary text-on-primary-fixed font-bold rounded-lg hover:brightness-110 active:scale-[0.98] transition-all duration-200 shadow-md flex items-center justify-center gap-xs" type="submit">
                    Log In
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Logins -->
<div class="mt-xl">
<div class="relative mb-lg">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
<div class="relative flex justify-center text-label-sm uppercase tracking-wider"><span class="bg-surface-container-low px-md text-on-surface-variant font-label-sm">Or continue with</span></div>

<a class="text-on-surface-variant font-body-sm text-body-sm hover:underline hover:text-primary transition-all" href="#">About</a>

<a class="text-on-surface-variant font-body-sm text-body-sm hover:underline hover:text-primary transition-all" href="#">Privacy</a>

<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Add small hover interaction for inputs
        const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.classList.add('duration-200');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Form submission micro-interaction
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                alert('In a real application, this would authenticate the user.');
            }, 1500);
        });
    </script>
